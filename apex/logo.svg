<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional glow effect) -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="apexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main apex peak (triangle pointing up) -->
  <polygon points="50,10 85,85 15,85" fill="none" stroke="url(#apexGradient)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Inner circuit-like lines forming tech aesthetic -->
  <line x1="50" y1="10" x2="50" y2="50" stroke="url(#apexGradient)" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="30" y2="75" stroke="url(#apexGradient)" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="70" y2="75" stroke="url(#apexGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Tech nodes (circles) at key points -->
  <circle cx="50" cy="10" r="3" fill="url(#apexGradient)" filter="url(#glow)"/>
  <circle cx="30" cy="75" r="2.5" fill="url(#apexGradient)" opacity="0.8"/>
  <circle cx="70" cy="75" r="2.5" fill="url(#apexGradient)" opacity="0.8"/>
  <circle cx="50" cy="50" r="2" fill="url(#apexGradient)" opacity="0.7"/>
  
  <!-- Subtle horizontal lines for "innovation" wave -->
  <line x1="20" y1="65" x2="40" y2="65" stroke="url(#apexGradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="60" y1="65" x2="80" y2="65" stroke="url(#apexGradient)" stroke-width="0.8" opacity="0.4"/>
</svg>
